<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Adventure RPG 3D</title>
<style>
html, body, body * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}
body {
    margin: 0;
    overflow: hidden;
    font-family: "Courier New", monospace;
    background: #87ceeb;
    image-rendering: pixelated;
}
#game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
}
#hud {
    position: fixed;
    top: 12px;
    left: 12px;
    color: white;
    background: #0009;
    padding: 12px;
    border: 3px solid #f5d77e;
    border-radius: 0;
    box-shadow: 4px 4px 0 #18223b;
    font-weight: bold;
    z-index: 2;
}
#controls {
    position: fixed;
    bottom: 25px;
    left: 20px;
    display: flex;
    gap: 8px;
    z-index: 3;
}
button {
    width: 58px;
    height: 58px;
    border: 0;
    border: 3px solid #ffe49a;
    border-radius: 0;
    box-shadow: 3px 3px 0 #17213a;
    color: white;
    background: #263dba;
    font-size: 22px;
    touch-action: none;
}
#sleep {
    position: fixed;
    right: 20px;
    bottom: 105px;
    width: 100px;
    height: 52px;
    background: #795548;
    font-size: 14px;
}
#collect {
    position: fixed;
    right: 20px;
    bottom: 30px;
    width: 100px;
    height: 65px;
    background: #278447;
    font-size: 14px;
    line-height: 1.2;
}
#shopOpen { position:fixed; top:12px; right:12px; width:112px; height:52px; background:#9b552d; font-size:14px; z-index:4; }
#shopPanel { display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(320px,82vw); padding:18px; color:#fff4c9; background:#25334b; border:4px solid #f6ce6d; box-shadow:6px 6px 0 #111827; z-index:10; font-family:"Courier New",monospace; text-align:center; }
#shopPanel h2 { margin:0 0 10px; color:#ffd96a; }
#shopPanel p { line-height:1.5; }
#shopPanel button { width:100%; height:auto; min-height:46px; margin-top:8px; padding:8px; font-size:14px; background:#27734c; }
#shopPanel #closeShop { background:#87423b; }
</style>
</head>
<body>

<div id="hud">
    🌿 Adventure RPG<br>
    ❤️ Здоровье: 100<br>
    ⭐ Уровень: 1<br>
    🪙 Монеты: <span id="coins">0</span><br>
    🌤️ Время: <span id="dayLabel">День</span>
</div>

<div id="controls">
    <button id="left">◀</button>
    <button id="forward">▲</button>
    <button id="back">▼</button>
    <button id="right">▶</button>
</div>

<button id="sleep">🛏️ Спать</button>
<button id="collect">🪓 Рубить<br>дерево</button>
<button id="shopOpen">🏪 Магазин</button>
<div id="shopPanel">
  <h2>🏪 МАГАЗИН</h2>
  <p>Добро пожаловать в городскую лавку!</p>
  <p>Улучшенный топор — <b>15 монет</b><br>Срубает дерево за 2 удара.</p>
  <button id="buyAxe">Купить улучшенный топор</button>
  <button id="closeShop">Выйти из магазина</button>
</div>

<script src="./three.min.js"></script>
<script>
// Усложняем случайное копирование содержимого интерфейса игры.
document.addEventListener("contextmenu", event => event.preventDefault());
document.addEventListener("selectstart", event => event.preventDefault());
document.addEventListener("dragstart", event => event.preventDefault());
document.addEventListener("copy", event => event.preventDefault());
document.addEventListener("cut", event => event.preventDefault());

if (typeof THREE === "undefined") {
    document.body.innerHTML = `
        <div style="color:white;background:#172333;padding:25px;font-family:Arial">
            <h2>Ошибка загрузки 3D</h2>
            <p>Не удалось загрузить Three.js.</p>
            <p>Проверь подключение к интернету.</p>
        </div>
    `;
    throw new Error("Three.js не загружена");
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 100);

const camera = new THREE.PerspectiveCamera(
    70, innerWidth / innerHeight, 0.1, 200
);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(Math.max(320, Math.floor(innerWidth / 2)), Math.max(180, Math.floor(innerHeight / 2)), false);
renderer.setPixelRatio(1);
renderer.domElement.style.width = "100vw";
renderer.domElement.style.height = "100vh";
renderer.domElement.style.imageRendering = "pixelated";
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
renderer.domElement.id = "game";

scene.add(new THREE.HemisphereLight(0xffffff, 0x52633b, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
scene.add(sun);

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x68a94f })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

function box(x, y, z, sx, sy, sz, color) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        new THREE.MeshStandardMaterial({ color })
    );
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
}

const trees = [];

function tree(x, z) {
    const trunk = box(x, 1, z, 0.5, 2, 0.5, 0x76502d);
    const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.5, 3, 6),
        new THREE.MeshStandardMaterial({ color: 0x24743a })
    );
    leaves.position.set(x, 3, z);
    leaves.castShadow = true;
    scene.add(leaves);
    trees.push({ x, z, trunk, leaves, hits: 0 });
}

for (let i = 0; i < 35; i++) {
    const x = Math.random() * 70 - 35;
    const z = Math.random() * 70 - 35;
    if (Math.abs(x) > 7 || Math.abs(z) > 7) tree(x, z);
}

// Овцы и кролики из 3D-фигур гуляют по миру.
const animals = [];
function makeAnimal(x, z, color, type) {
    const animal = new THREE.Group();
    const coat = new THREE.MeshStandardMaterial({ color });
    const dark = new THREE.MeshStandardMaterial({ color: 0x55402b });
    const sheep = type === "sheep";
    const body = new THREE.Mesh(new THREE.BoxGeometry(sheep ? 1.05 : 0.65, sheep ? 0.65 : 0.4, 0.55), coat);
    body.position.y = sheep ? 0.72 : 0.48;
    animal.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(sheep ? 0.25 : 0.19, 10, 8), coat);
    head.position.set(0, sheep ? 0.9 : 0.58, -0.38);
    animal.add(head);
    for (const lx of [-0.22, 0.22]) for (const lz of [-0.17, 0.17]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, sheep ? 0.4 : 0.25, 0.12), dark);
        leg.position.set(lx, sheep ? 0.25 : 0.18, lz);
        animal.add(leg);
    }
    animal.position.set(x, 0, z);
    scene.add(animal);
    animals.push({ group: animal, angle: Math.random()*Math.PI*2, timer: 1+Math.random()*3, speed: 0.008+Math.random()*0.008 });
}
for (let i=0;i<5;i++) makeAnimal(Math.random()*24-12,Math.random()*24-12,0xf1eee3,"sheep");
for (let i=0;i<4;i++) makeAnimal(Math.random()*24-12,Math.random()*24-12,0x9a7049,"rabbit");

// Дом
box(5, 1.5, -5, 5, 3, 5, 0xe0c49a);

// Крыша
const roof = new THREE.Mesh(
    new THREE.ConeGeometry(4.2, 2.5, 4),
    new THREE.MeshStandardMaterial({ color: 0x9e3e32 })
);
roof.position.set(5, 4, -5);
roof.rotation.y = Math.PI / 4;
scene.add(roof);

// Город в 32-битном стиле: мощёная улица, домики, фонари и лавка.
const road = new THREE.Mesh(new THREE.PlaneGeometry(34, 9), new THREE.MeshStandardMaterial({color:0xb6a17a}));
road.rotation.x = -Math.PI / 2;
road.position.set(19, 0.025, -5);
scene.add(road);
for (let i=0;i<7;i++) box(4+i*5, 0.06, -5, 0.16, 0.03, 0.18, 0xf5d77e);
function townHouse(x,z,wall,roofColor) {
    box(x,1.6,z,4.2,3.2,3.8,wall);
    const r = new THREE.Mesh(new THREE.ConeGeometry(3.1,1.8,4),new THREE.MeshStandardMaterial({color:roofColor,flatShading:true}));
    r.position.set(x,4,z); r.rotation.y=Math.PI/4; r.castShadow=true; scene.add(r);
    box(x,0.9,z+1.96,0.85,1.8,0.12,0x65412c);
    box(x-1.15,2,z+2,0.72,0.72,0.12,0x77cbe8);
    box(x+1.15,2,z+2,0.72,0.72,0.12,0x77cbe8);
}
townHouse(15,-12,0xe8c78d,0xb64d3d);
townHouse(24,-12,0xd8b6ef,0x5544a4);
townHouse(28,1,0xf0d6a2,0x36865d);
// Магазин с ярким навесом и вывеской.
box(18,1.6,-1,4.8,3.2,4.2,0xe9c48c);
box(18,3.25,1.18,5.2,0.38,0x9c3d35);
box(18,2.95,1.43,3.4,0.55,0xffd85e);
box(18,3.8,1.4,2.3,0.3,0x4e2e26);
box(16.8,2.4,1.24,0.55,0.65,0x8bd4e8);
box(19.2,2.4,1.24,0.55,0.65,0x8bd4e8);
// Уличные фонари.
for (const lx of [10,22,29]) {
    box(lx,1.4,-7,0.16,2.8,0.16,0x493b35);
    box(lx,2.9,-7,0.75,0.28,0.55,0xffd978);
}
// Персонаж
const player = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 1.2, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x3268db })
);
body.position.y = 1.1;
player.add(body);

const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.38, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0xffcc99 })
);
head.position.y = 2;
player.add(head);

// Руки и ноги с шарнирами, чтобы они могли двигаться при ходьбе.
const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
const pantsMaterial = new THREE.MeshStandardMaterial({ color: 0x263b6b });
function makeLimb(material, width, height, depth, x, y) {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    const limb = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
    limb.position.y = -height / 2;
    limb.castShadow = true;
    pivot.add(limb);
    player.add(pivot);
    return pivot;
}
const leftArm = makeLimb(skinMaterial, 0.24, 0.72, 0.25, -0.57, 1.55);
const rightArm = makeLimb(skinMaterial, 0.24, 0.72, 0.25, 0.57, 1.55);
const leftLeg = makeLimb(pantsMaterial, 0.3, 0.7, 0.32, -0.23, 0.72);
const rightLeg = makeLimb(pantsMaterial, 0.3, 0.7, 0.32, 0.23, 0.72);

// Топор в правой руке.
const axe = new THREE.Group();
const axeHandle = new THREE.Mesh(
    new THREE.BoxGeometry(0.09, 0.72, 0.09),
    new THREE.MeshStandardMaterial({ color: 0x80502c })
);
axeHandle.position.y = -0.25;
axe.add(axeHandle);
const axeHead = new THREE.Mesh(
    new THREE.BoxGeometry(0.38, 0.24, 0.12),
    new THREE.MeshStandardMaterial({ color: 0xbfc7d1, metalness: 0.45, roughness: 0.4 })
);
axeHead.position.set(0.13, 0.02, 0);
axe.add(axeHead);
axe.position.set(0, -0.62, 0.02);
rightArm.add(axe);

scene.add(player);
player.position.set(0, 0, 0);

let cameraYaw = 0;
const cameraPitch = 0.46;
const cameraDistance = 9;
camera.position.set(0, 5, 8);
camera.lookAt(player.position);

let coins = 0;
const keys = {};
let dayClock = 0;
const dayLength = 120;

// Состояние ходьбы и рубки: нужно инициализировать до первого кадра игры.
let walkTime = 0;
let chopCooldown = 0;
let chopping = false;
let chopAnimation = 0;
let axeUpgrade = false;

// Камера вращается вокруг персонажа только по горизонтали.
// Приближение и изменение наклона отключены.
let draggingCamera = false;
let lastPointerX = 0;
renderer.domElement.addEventListener("pointerdown", e => {
    if (e.target !== renderer.domElement) return;
    draggingCamera = true;
    lastPointerX = e.clientX;
    renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener("pointermove", e => {
    if (!draggingCamera) return;
    const dx = e.clientX - lastPointerX;
    lastPointerX = e.clientX;
    cameraYaw -= dx * 0.008;
});
function stopCameraDrag() { draggingCamera = false; }
renderer.domElement.addEventListener("pointerup", stopCameraDrag);
renderer.domElement.addEventListener("pointercancel", stopCameraDrag);

function bindButton(id, key) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
    });

    for (const event of ["pointerup", "pointercancel", "pointerleave"]) {
        button.addEventListener(event, () => keys[key] = false);
    }
}

bindButton("left", "left");
bindButton("right", "right");
bindButton("forward", "forward");
bindButton("back", "back");

document.addEventListener("keydown", e => {
    if (e.key === "w" || e.key === "ArrowUp") keys.forward = true;
    if (e.key === "s" || e.key === "ArrowDown") keys.back = true;
    if (e.key === "a" || e.key === "ArrowLeft") keys.left = true;
    if (e.key === "d" || e.key === "ArrowRight") keys.right = true;
});

document.addEventListener("keyup", e => {
    if (e.key === "w" || e.key === "ArrowUp") keys.forward = false;
    if (e.key === "s" || e.key === "ArrowDown") keys.back = false;
    if (e.key === "a" || e.key === "ArrowLeft") keys.left = false;
    if (e.key === "d" || e.key === "ArrowRight") keys.right = false;
});

document.getElementById("sleep").addEventListener("click", () => {
    if (Math.hypot(player.position.x - 5, player.position.z + 5) > 5.5) {
        showMessage("Подойди к дому, чтобы поспать!");
        return;
    }
    dayClock = 0;
    showMessage("Ты поспал. Наступило утро!");
});

document.getElementById("collect").addEventListener("pointerdown", e => {
    e.preventDefault();
    chopping = true;
});
for (const event of ["pointerup", "pointercancel", "pointerleave"]) {
    document.getElementById("collect").addEventListener(event, () => chopping = false);
}
document.getElementById("collect").addEventListener("click", () => {
    chopping = true;
    chopAnimation = 0.001;
    // Один удар топором. Дерево даёт монеты после нескольких ударов.
    if (chopCooldown > 0) return;
    let nearest = null;
    let nearestDistance = Infinity;
    for (const t of trees) {
        const d = Math.hypot(t.x - player.position.x, t.z - player.position.z);
        if (d < nearestDistance) { nearestDistance = d; nearest = t; }
    }
    if (!nearest || nearestDistance > 3.2) {
        showMessage("Подойди ближе к дереву!");
        return;
    }
    rightArm.rotation.x = -1.5;
    rightArm.rotation.z = -0.35;
    nearest.hits++;
    chopCooldown = 0.45;
    if (nearest.hits >= (axeUpgrade ? 2 : 3)) {
        scene.remove(nearest.trunk);
        scene.remove(nearest.leaves);
        const index = trees.indexOf(nearest);
        if (index !== -1) trees.splice(index, 1);
        coins += 5;
        document.getElementById("coins").textContent = coins;
        showMessage("+5 монет за дерево!");
    } else {
        showMessage("Удар топором: " + nearest.hits + (axeUpgrade ? "/2" : "/3"));
    }
});

// Магазин доступен рядом с городской лавкой.
const shopPanel = document.getElementById("shopPanel");
document.getElementById("shopOpen").addEventListener("click", () => {
    if (Math.hypot(player.position.x - 18, player.position.z - (-1)) > 7) {
        showMessage("Иди по дороге в город к лавке!");
        return;
    }
    shopPanel.style.display = "block";
});
document.getElementById("closeShop").addEventListener("click", () => shopPanel.style.display = "none");
document.getElementById("buyAxe").addEventListener("click", () => {
    if (axeUpgrade) { showMessage("У тебя уже есть улучшенный топор!"); return; }
    if (coins < 15) { showMessage("Нужно 15 монет. Руби деревья!"); return; }
    coins -= 15;
    axeUpgrade = true;
    document.getElementById("coins").textContent = coins;
    document.getElementById("buyAxe").textContent = "Улучшенный топор куплен ✓";
    showMessage("Топор улучшен! Теперь нужно 2 удара.");
});
let messageTimer = 0;
function showMessage(message) {
    let el = document.getElementById("gameMessage");
    if (!el) {
        el = document.createElement("div");
        el.id = "gameMessage";
        el.style.cssText = "position:fixed;top:100px;left:50%;transform:translateX(-50%);background:#000b;color:white;padding:10px 14px;border-radius:10px;z-index:5;text-align:center;";
        document.body.appendChild(el);
    }
    el.textContent = message;
    el.style.display = "block";
    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => el.style.display = "none", 1400);
}

function animate() {
    requestAnimationFrame(animate);

    dayClock = (dayClock + 1/60) % dayLength;
    const nightAmount = (1 - Math.cos(dayClock/dayLength*Math.PI*2))/2;
    const sky = new THREE.Color(0x87ceeb).lerp(new THREE.Color(0x101b38), nightAmount);
    scene.background.copy(sky);
    scene.fog.color.copy(sky);
    sun.intensity = 2 - nightAmount*1.65;
    scene.children.forEach(obj => { if (obj.isHemisphereLight) obj.intensity = 2 - nightAmount*1.35; });
    document.getElementById("dayLabel").textContent = nightAmount > 0.62 ? "Ночь" : "День";

    for (const animal of animals) {
        animal.timer -= 1/60;
        if (animal.timer <= 0) { animal.angle += (Math.random()-0.5)*2.2; animal.timer = 1.5+Math.random()*4; }
        animal.group.position.x += Math.sin(animal.angle)*animal.speed;
        animal.group.position.z += Math.cos(animal.angle)*animal.speed;
        if (Math.abs(animal.group.position.x)>32 || Math.abs(animal.group.position.z)>32) animal.angle += Math.PI;
        animal.group.rotation.y = Math.atan2(Math.sin(animal.angle),Math.cos(animal.angle));
    }

    const movingForward = keys.forward || keys.back;
    const movingSideways = keys.left || keys.right;
    const moveForward = (keys.forward ? 1 : 0) - (keys.back ? 1 : 0);
    const moveSide = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const moveLength = Math.hypot(moveForward, moveSide) || 1;
    const speed = 0.085;
    if (movingForward || movingSideways) {
        const forwardX = -Math.sin(cameraYaw);
        const forwardZ = -Math.cos(cameraYaw);
        const rightX = Math.cos(cameraYaw);
        const rightZ = -Math.sin(cameraYaw);
        player.position.x += (forwardX * moveForward + rightX * moveSide) / moveLength * speed;
        player.position.z += (forwardZ * moveForward + rightZ * moveSide) / moveLength * speed;
        player.rotation.y = Math.atan2(
            forwardX * moveForward + rightX * moveSide,
            forwardZ * moveForward + rightZ * moveSide
        );
        walkTime += 0.16;
        leftLeg.rotation.x = Math.sin(walkTime) * 0.65;
        rightLeg.rotation.x = -Math.sin(walkTime) * 0.65;
        if (!chopping) {
            leftArm.rotation.x = -Math.sin(walkTime) * 0.5;
            rightArm.rotation.x = Math.sin(walkTime) * 0.5;
        }
    } else {
        leftLeg.rotation.x *= 0.8;
        rightLeg.rotation.x *= 0.8;
        if (!chopping) {
            leftArm.rotation.x *= 0.8;
            rightArm.rotation.x *= 0.8;
        }
    }
    if (chopAnimation > 0) {
        chopAnimation += 1/60;
        const swing = Math.sin(Math.min(chopAnimation / 0.38, 1) * Math.PI);
        rightArm.rotation.x = -0.25 - swing * 1.65;
        rightArm.rotation.z = -swing * 0.42;
        axe.rotation.z = swing * 0.28;
        if (chopAnimation >= 0.38) {
            chopAnimation = 0;
            chopping = false;
            axe.rotation.z = 0;
        }
    }
    if (chopCooldown > 0) chopCooldown = Math.max(0, chopCooldown - 1 / 60);
    if (chopCooldown === 0 && !chopping) {
        rightArm.rotation.x *= 0.82;
        rightArm.rotation.z *= 0.82;
    }

    const horizontalDistance = Math.cos(cameraPitch) * cameraDistance;
    const targetCameraX = player.position.x + Math.sin(cameraYaw) * horizontalDistance;
    const targetCameraY = 1 + Math.sin(cameraPitch) * cameraDistance;
    const targetCameraZ = player.position.z + Math.cos(cameraYaw) * horizontalDistance;

    camera.position.x += (targetCameraX - camera.position.x) * 0.12;
    camera.position.y += (targetCameraY - camera.position.y) * 0.12;
    camera.position.z += (targetCameraZ - camera.position.z) * 0.12;
    camera.lookAt(player.position.x, 1, player.position.z);

    renderer.render(scene, camera);
}

addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(Math.max(320, Math.floor(innerWidth / 2)), Math.max(180, Math.floor(innerHeight / 2)), false);
});

animate();
</script>
</body>
</html>
