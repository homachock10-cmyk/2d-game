<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Adventure RPG — Pixel Town</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172b38;font-family:monospace}
#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}
#hud{position:fixed;left:8px;top:8px;background:#18233bea;color:#fff2c5;border:3px solid #f5d46c;padding:8px 10px;font-size:13px;line-height:1.55;box-shadow:3px 3px #10151f;z-index:2}
#controls{position:fixed;left:12px;bottom:15px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:46px 46px;gap:4px;z-index:3}
button{font-family:monospace;font-weight:bold;color:#fff5cf;background:#344f8b;border:3px solid #f5d46c;border-radius:0;box-shadow:3px 3px #10151f;touch-action:none}
#controls button{font-size:20px}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.action{position:fixed;right:12px;width:105px;height:48px;font-size:13px;z-index:3}
#chop{bottom:18px;background:#287445}#interact{bottom:72px;background:#9b552d}#sleep{bottom:126px;background:#654c9b}
#hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);max-width:70vw;background:#18233beF;color:#fff4c8;border:2px solid #f5d46c;padding:8px 12px;text-align:center;font-size:13px;z-index:4;display:none}
#shopPanel{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,90vw);max-height:82vh;overflow:auto;background:#26334b;color:#fff2c5;border:4px solid #f5d46c;box-shadow:6px 6px #10151f;padding:14px}
#shopPanel h2{text-align:center;color:#ffdb68;margin:0 0 8px;font-size:20px}
#shopPanel p{text-align:center;margin:5px 0 10px;font-size:13px}
#goods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#goods button{min-height:62px;padding:6px;background:#316b4a;font-size:12px;line-height:1.35}
#closeShop{display:block;width:100%;height:42px;margin-top:10px;background:#91453b}
@media(min-width:800px){#controls{left:20px;bottom:20px}#hud{font-size:14px}#hint{font-size:15px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Adventure RPG 2D"></canvas>
<div id="hud">🗡 ADVENTURE RPG<br>❤️ Здоровье: <span id="health">100</span><br>⭐ Уровень: 1<br>🪙 Монеты: <span id="coins">0</span><br>🌤 Время: <span id="day">День</span><br>🪓 Топор: <span id="axeStatus">обычный</span></div>
<div id="hint"></div>
<div id="controls"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div>
<button id="chop" class="action">🪓 Рубить</button><button id="interact" class="action">🏪 Магазин</button><button id="sleep" class="action">🛏 Спать</button>
<div id="shopPanel"><h2>🏪 ГОРОДСКАЯ ЛАВКА</h2><p>Товары для путешественника. Монеты: <b id="shopCoins">0</b></p><div id="goods"></div><button id="closeShop">Закрыть магазин</button></div>
<script>
(function(){
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const W=480,H=270,world={w:1200,h:900};let dpr=1;
function resize(){canvas.width=W;canvas.height=H;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();
const player={x:145,y:430,dir:0,walk:0,chop:0,health:100,coins:0,axe:1,potions:0,seeds:0,boots:false,coat:false};
const keys={};let cam=0,drag=false,lastX=0,dayTick=0,messageTimer=0,nearShop=false;
const trees=[],animals=[],buildings=[];
function building(x,y,w,h,wall,roof,name,kind){buildings.push({x,y,w,h,wall,roof,name,kind})}
building(105,360,72,58,'#d7b37a','#a74338','Дом','home');
building(670,240,76,60,'#e5c48c','#b44a43','Лавка оружия','shop');
building(785,240,76,60,'#d6a9df','#5545a0','Зелья','potion');
building(900,240,76,60,'#e9d39b','#428252','Снаряжение','gear');
building(670,370,78,62,'#e8a9a1','#a84c43','Пекарня','food');
building(790,370,78,62,'#b7d8a3','#43794b','Дом','home');
building(910,370,78,62,'#c5d6e9','#5b719b','Дом','home');
building(670,500,78,62,'#e9d39b','#a74338','Дом','home');
building(790,500,78,62,'#d7b37a','#4d6c9d','Дом','home');
building(910,500,78,62,'#e2b4c6','#a34c7a','Дом','home');
for(let i=0;i<56;i++){let x=35+Math.random()*1120,y=35+Math.random()*800;if(x>620&&x<1010&&y>190&&y<590)continue;if(Math.hypot(x-145,y-430)<90)continue;trees.push({x,y,hits:0,alive:true,phase:Math.random()*6})}
for(let i=0;i<12;i++)animals.push({x:80+Math.random()*1000,y:80+Math.random()*700,dir:Math.random()*6.28,t:Math.random()*100,type:i%2?'rabbit':'sheep'});
const products=[
{id:'axe',name:'🪓 Улучшенный топор',price:15,desc:'Дерево за 2 удара',buy(){if(player.axe>1)return 'У тебя уже есть топор!';player.axe=2;return 'Топор улучшен!'}},
{id:'potion',name:'❤️ Зелье здоровья',price:8,desc:'+30 здоровья',buy(){if(player.health>=100)return 'Здоровье уже полное';player.health=Math.min(100,player.health+30);return 'Здоровье восстановлено!'}},
{id:'boots',name:'🥾 Быстрые сапоги',price:20,desc:'Быстрее ходить',buy(){if(player.boots)return 'Сапоги уже куплены';player.boots=true;return 'Теперь ты быстрее!'}},
{id:'coat',name:'🧥 Плащ героя',price:25,desc:'Новый вид персонажа',buy(){if(player.coat)return 'Плащ уже куплен';player.coat=true;return 'Плащ надет!'}},
{id:'seeds',name:'🌱 Семена',price:5,desc:'Для будущего сада',buy(){player.seeds+=1;return 'Семена добавлены в рюкзак: '+player.seeds}},
{id:'meal',name:'🍞 Походная еда',price:6,desc:'Восстанавливает здоровье',buy(){if(player.health>=100)return 'Здоровье уже полное';player.health=Math.min(100,player.health+18);return 'Ты перекусил!'}}
];
const goods=document.getElementById('goods');
function renderGoods(list){goods.replaceChildren();list.forEach(p=>{const button=document.createElement('button');button.innerHTML=p.name+'<br>'+p.desc+'<br>🪙 '+p.price;button.addEventListener('click',()=>{if(player.coins<p.price){say('Не хватает монет!');return}const msg=p.buy();if(msg.includes('уже')||msg.includes('полное')){say(msg);return}player.coins-=p.price;updateHud();say(msg)});goods.appendChild(button)})}
const stock={shop:[products[0],products[3]],potion:[products[1],products[5]],gear:[products[2],products[3]],food:[products[5],products[4]]};
function updateHud(){document.getElementById('coins').textContent=player.coins;document.getElementById('shopCoins').textContent=player.coins;document.getElementById('health').textContent=player.health;document.getElementById('axeStatus').textContent=player.axe>1?'улучшенный':'обычный'}
function say(t){const e=document.getElementById('hint');e.textContent=t;e.style.display='block';clearTimeout(messageTimer);messageTimer=setTimeout(()=>e.style.display='none',1800)}
function nearBuilding(){return buildings.find(b=>b.kind!=='home'&&Math.hypot(player.x-(b.x+b.w/2),player.y-(b.y+b.h+12))<92)}
function openShop(){const b=nearBuilding();if(!b){say('Подойди к одной из городских лавок!');return}document.querySelector('#shopPanel h2').textContent='🏪 '+b.name.toUpperCase();renderGoods(stock[b.kind]||products);document.getElementById('shopPanel').style.display='block';updateHud()}
document.getElementById('interact').addEventListener('click',openShop);document.getElementById('closeShop').addEventListener('click',()=>document.getElementById('shopPanel').style.display='none');
document.getElementById('sleep').addEventListener('click',()=>{if(Math.hypot(player.x-140,player.y-425)>90){say('Подойди к своему дому, чтобы поспать');return}dayTick=0;player.health=100;updateHud();say('Ты отдохнул. Началось утро!')});
function chop(){if(player.chop>0)return;let t=null,dist=1e9;for(const a of trees){let d=Math.hypot(player.x-a.x,player.y-a.y);if(a.alive&&d<dist){dist=d;t=a}}if(!t||dist>52){say('Подойди ближе к дереву!');return}player.chop=1;t.hits++;if(t.hits>=(player.axe>1?2:3)){t.alive=false;player.coins+=5;updateHud();say('Дерево срублено: +5 монет!')}else say('Удар топором '+t.hits+'/'+(player.axe>1?2:3))}
document.getElementById('chop').addEventListener('click',chop);
function bind(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture?.(e.pointerId)});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[key]=false)}
bind('up','up');bind('down','down');bind('left','left');bind('right','right');
addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=true;if(['ArrowDown','s','S'].includes(e.key))keys.down=true;if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.key===' '){e.preventDefault();chop()}});
addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=false;if(['ArrowDown','s','S'].includes(e.key))keys.down=false;if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
canvas.addEventListener('pointerdown',e=>{if(document.getElementById('shopPanel').style.display==='block')return;drag=true;lastX=e.clientX;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;cam+=(e.clientX-lastX)*0.008;lastX=e.clientX});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>drag=false);
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function pixelText(t,x,y,c='#fff'){ctx.fillStyle=c;ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText(t,Math.round(x),Math.round(y))}
function drawTree(t){if(!t.alive)return;let x=t.x,y=t.y;rect(x-4,y-4,8,13,'#79502d');rect(x-12,y-21,24,18,'#246b3b');rect(x-9,y-26,18,10,'#39894a');rect(x-5,y-29,10,6,'#57a44b');rect(x-9,y-20,5,5,'#69b955');}
function drawHouse(b){const x=b.x,y=b.y;rect(x+4,y+12,b.w,b.h,'#70533e');rect(x,y+7,b.w,b.h,b.wall);rect(x-5,y,b.w+10,19,b.roof);rect(x+b.w/2-7,y+b.h+2,14,23,'#71462e');rect(x+9,y+23,13,12,'#75c9df');rect(x+b.w-22,y+23,13,12,'#75c9df');rect(x+10,y+24,11,2,'#d9f4ff');rect(x+b.w-21,y+24,11,2,'#d9f4ff');if(b.kind!=='home'){rect(x+12,y+3,b.w-24,9,'#ffe27a');pixelText(b.kind==='shop'?'SHOP':b.kind==='potion'?'POTIONS':b.kind==='gear'?'GEAR':'BAKE',x+b.w/2,y+10,'#513325')}}
function drawAnimal(a){let x=a.x,y=a.y;rect(x-7,y-4,14,8,a.type==='sheep'?'#eee9d8':'#9c714c');rect(x+4,y-7,6,6,a.type==='sheep'?'#eee9d8':'#9c714c');rect(x+5,y-3,2,2,'#24232b');rect(x-5,y+3,2,4,'#514334');rect(x+4,y+3,2,4,'#514334');if(a.type==='rabbit'){rect(x+4,y-13,2,7,'#9c714c');rect(x+8,y-12,2,6,'#9c714c')}}
function drawPlayer(){const x=player.x,y=player.y,step=Math.sin(player.walk)*3,sw=player.chop>0?Math.sin(player.chop*Math.PI)*10:Math.sin(player.walk)*3;rect(x-6,y-19,12,6,player.coat?'#9a3d91':'#56392a');rect(x-7,y-13,14,14,player.coat?'#a84d9e':'#326bd5');rect(x-9,y-12,3,10,'#ffca98');rect(x+6,y-12,3,10,'#ffca98');rect(x-6,y+1,5,10+step,'#263c68');rect(x+2,y+1,5,10-step,'#263c68');rect(x-7,y-25,14,12,'#ffca98');rect(x-8,y-27,16,5,'#56392a');rect(x-4,y-21,2,2,'#29212a');rect(x+3,y-21,2,2,'#29212a');rect(x+7,y-10+sw,3,10,'#ffca98');rect(x+8,y-2+sw,3,8,'#79502d');rect(x+10,y-5+sw,7,4,'#c5d0d8');}
function frame(){requestAnimationFrame(frame);dayTick=(dayTick+1/60)%120;document.getElementById('day').textContent=dayTick>72?'Ночь':'День';let mvx=(keys.right?1:0)-(keys.left?1:0),mvy=(keys.down?1:0)-(keys.up?1:0);if(mvx||mvy){const ca=Math.cos(cam),sa=Math.sin(cam),nx=mvx*ca-mvy*sa,ny=mvx*sa+mvy*ca,s=player.boots?2.3:1.7;player.x=Math.max(18,Math.min(world.w-18,player.x+nx*s));player.y=Math.max(28,Math.min(world.h-20,player.y+ny*s));player.walk+=.23;player.dir=Math.atan2(ny,nx)}if(player.chop>0)player.chop=Math.max(0,player.chop-.085);
for(const a of animals){a.t++;if(a.t%90===0)a.dir+=(Math.random()-.5)*2;a.x+=Math.cos(a.dir)*.22;a.y+=Math.sin(a.dir)*.22;if(a.x<20||a.x>1180||a.y<20||a.y>880)a.dir+=Math.PI}
const scale=Math.min(W/innerWidth*1.3,H/innerHeight*1.3);ctx.fillStyle='#7fb95d';ctx.fillRect(0,0,W,H);const night=dayTick>72;ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-cam);ctx.translate(-player.x,-player.y);
rect(0,0,world.w,world.h,'#77b65c');
// Long cobbled road through the town and a square.
rect(620,185,390,470,'#bca77c');rect(625,205,380,430,'#cbb68a');for(let y=210;y<640;y+=18)for(let x=635;x<1000;x+=22)rect(x+((y/18|0)%2)*10,y,17,2,'#aa956d');
rect(40,380,590,42,'#bca77c');rect(40,390,590,3,'#d7c59a');
for(const b of buildings)drawHouse(b);for(const t of trees)drawTree(t);for(const a of animals)drawAnimal(a);drawPlayer();
if(night){ctx.fillStyle='#101d4b55';ctx.fillRect(player.x-300,player.y-300,600,600)}
ctx.restore();
const shop=nearBuilding();if(shop&&!nearShop){say('Рядом '+shop.name+' — нажми «Магазин»!')}nearShop=!!shop;
ctx.fillStyle='#18233b';ctx.fillRect(W-116,H-17,108,12);ctx.fillStyle='#f5d46c';ctx.font='7px monospace';ctx.textAlign='center';ctx.fillText('Проведи по экрану: камера',W-62,H-8);
}
frame();updateHud();
})();
</script>
</body>
</html>
