name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/example/rpg
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

          # Create a bold fantasy RPG shield icon.
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, size in sizes.items():
              im = Image.new('RGB', (size, size), '#111a35')
              d = ImageDraw.Draw(im)
              # Pixel-art green field and gold frame.
              unit = max(2, size // 24)
              d.polygon([(size*.12,size*.10),(size*.88,size*.10),(size*.82,size*.68),(size*.50,size*.91),(size*.18,size*.68)], fill='#f5d46c')
              d.polygon([(size*.19,size*.17),(size*.81,size*.17),(size*.75,size*.63),(size*.50,size*.82),(size*.25,size*.63)], fill='#5844a0')
              d.rectangle((int(size*.32),int(size*.73),int(size*.43),int(size*.77)), fill='#7ecb68')
              d.rectangle((int(size*.57),int(size*.73),int(size*.68),int(size*.77)), fill='#7ecb68')
              for x,y,col in [(0.18,0.72,'#6ba95b'),(0.34,0.82,'#8cc66a'),(0.68,0.75,'#6ba95b'),(0.82,0.84,'#8cc66a')]:
                  xx,yy=int(size*x),int(size*y)
                  d.rectangle((xx,yy,xx+unit*2,yy+unit*2), fill=col)
              font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
              font=ImageFont.truetype(font_path, int(size*.30))
              box=d.textbbox((0,0),'RPG',font=font,stroke_width=max(1,size//80))
              tw,th=box[2]-box[0],box[3]-box[1]
              d.text(((size-tw)//2, int(size*.23)-box[1]),'RPG',font=font,fill='#fff2c5',stroke_width=max(1,size//80),stroke_fill='#743e38')
              im.save(f'app/src/main/res/mipmap-{density}/ic_launcher.png')
          PY

          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          fi
          
          
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AdventureRPG'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.rpg'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.rpg'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="RPG"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#55bb77</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/rpg/MainActivity.java <<'EOF'
          package com.example.rpg;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.view.View;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setBackgroundColor(0xFF87CEEB);

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdventureRPG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
